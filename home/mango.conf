# Mango 0.18.2. Common habits follow niri.kdl and hyprland.lua.
# Mango imports the Wayland/IPC environment and starts mango-session.target.
env=XDG_SESSION_TYPE,wayland
env=NIXOS_OZONE_WL,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=XMODIFIERS,@im=fcitx
auto_reload_config=1

# Writable output rules precede the fallback because Mango uses first match.
source=~/.config/mango/monitors.conf
monitor_rule=name:.*,scale:2

xkb_rules_layout=us
repeat_delay=600
repeat_rate=25
mouse_accel_profile=1
mouse_accel_speed=0.0
trackpad_accel_profile=2
trackpad_accel_speed=0.0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_click_method=2
trackpad_scroll_method=1
trackpad_scroll_factor=0.5
sloppy_focus=1
warp_cursor=0
edge_scroller_pointer_focus=0
axis_bind_apply_timeout=150
cursor_theme=Bibata-Modern-Ice
cursor_size=28

gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
border_px=2
border_radius=10
blur=1
blur_layer=1
blur_params_num_passes=4
blur_params_saturation=1.0
animation_type_open=slide
animation_type_close=fade
animation_duration_open=250
animation_duration_close=180
animation_duration_move=250
animation_duration_tag=250

# Catppuccin fallback; Noctalia's generated palette overrides these below.
root_color=0x1e1e2eff
border_color=0x45475aff
focus_color=0xcba6f7ff
urgent_color=0xf38ba8ff
window_rule=app_id:^(kitty|org\.kde\.dolphin)$,focused_opacity:0.90,unfocused_opacity:0.78
window_rule=app_id:^io\.missioncenter\.MissionCenter$,is_floating:1,width:0.65,height:0.7
window_rule=app_id:^QQ$,title:^图片查看器$,is_floating:1
window_rule=app_id:^firefox$,title:^([Bb]itwarden|.*[Ee]xtension:.*[Bb]itwarden.*)$,is_floating:1
window_rule=app_id:^mango-scratch$,is_named_scratchpad:1,width:0.8,height:0.8
layer_rule=layer_name:^noctalia-bar-.+$,no_blur:1,no_shadow:1
layer_rule=layer_name:^selection$,no_blur:1,no_animation:1
source=~/.config/mango/noctalia.conf

# Ten normal tags plus Mango's special overlay tag 0.
tag_num=10
tag_rule=id:*,layout_name:scroller
circle_layout=scroller,tile,center_tile,monocle,grid,dwindle
scroller_default_proportion=0.5
scroller_proportion_preset=0.333333,0.5,0.666667,1.0
scroller_prefer_overspread=0
new_is_master=0
dwindle_preserve_split=1

# 窗口与会话 / Windows and session
bind=SUPER,q,killclient #"关闭当前窗口 / Close window"
bind=ALT,F4,killclient #"关闭当前窗口 / Close window"
bind=SUPER+ALT,F4,killclient,force #"强制结束当前窗口 / Force kill window"
bind=SUPER,w,togglefloating #"切换窗口浮动 / Toggle floating"
bind=SUPER,m,togglemaximizescreen #"切换窗口最大化 / Toggle maximize"
bind=SUPER+SHIFT,f,togglefullscreen #"切换窗口全屏 / Toggle fullscreen"
bind=SUPER,F11,togglefullscreen #"切换窗口全屏 / Toggle fullscreen"
bind=SUPER+CTRL,w,toggleoverlay #"切换窗口置顶 / Toggle always on top"
bind=SUPER+SHIFT,w,toggleglobal #"切换窗口跨标签显示 / Toggle sticky window"
bindl=SUPER+ALT,l,spawn,noctalia msg session lock #"锁定屏幕 / Lock screen"
bind=SUPER,Tab,view,-1 #"切换到上次标签 / Previous tagset"
bind=ALT,Tab,switcher,all_next #"切换到下一个窗口 / Next window across monitors"
bind=ALT+SHIFT,Tab,switcher,all_prev #"切换到上一个窗口 / Previous window across monitors"
bind=SUPER+SHIFT,e,quit #"退出 Mango 会话 / Quit Mango session"
bind=SUPER+CTRL+SHIFT,r,reload_config #"重新加载 Mango 配置 / Reload Mango config"

# 焦点与窗口移动 / Focus and movement
bind=SUPER,Left,focusdir,left #"切换到左侧窗口 / Focus left"
bind=SUPER,Right,focusdir,right #"切换到右侧窗口 / Focus right"
bind=SUPER,Up,focusdir,up #"切换到上方窗口 / Focus up"
bind=SUPER,Down,focusdir,down #"切换到下方窗口 / Focus down"
bind=SUPER,h,focusdir,left #"切换到左侧窗口 / Focus left"
bind=SUPER,l,focusdir,right #"切换到右侧窗口 / Focus right"
bind=SUPER,k,focusdir,up #"切换到上方窗口 / Focus up"
bind=SUPER,j,focusdir,down #"切换到下方窗口 / Focus down"
bind=SUPER+CTRL,Left,move_client,left #"向左移动平铺窗口 / Move tiled window left"
bind=SUPER+CTRL,Right,move_client,right #"向右移动平铺窗口 / Move tiled window right"
bind=SUPER+CTRL,Up,move_client,up #"向上移动平铺窗口 / Move tiled window up"
bind=SUPER+CTRL,Down,move_client,down #"向下移动平铺窗口 / Move tiled window down"
bind=SUPER+SHIFT,Left,resizewin,-50,+0 #"缩小窗口宽度 / Narrower window"
bind=SUPER+SHIFT,Right,resizewin,+50,+0 #"增大窗口宽度 / Wider window"
bind=SUPER+SHIFT,Up,resizewin,+0,-50 #"缩小窗口高度 / Shorter window"
bind=SUPER+SHIFT,Down,resizewin,+0,+50 #"增大窗口高度 / Taller window"
bind=SUPER+SHIFT,h,focusmon,left #"切换到左侧显示器 / Focus display left"
bind=SUPER+SHIFT,l,focusmon,right #"切换到右侧显示器 / Focus display right"
bind=SUPER+SHIFT,k,focusmon,up #"切换到上侧显示器 / Focus display up"
bind=SUPER+SHIFT,j,focusmon,down #"切换到下侧显示器 / Focus display down"
bind=SUPER+CTRL+SHIFT,Left,tagmon,left #"移动窗口到左侧显示器 / Move to display left"
bind=SUPER+CTRL+SHIFT,Right,tagmon,right #"移动窗口到右侧显示器 / Move to display right"
bind=SUPER+CTRL+SHIFT,Up,tagmon,up #"移动窗口到上侧显示器 / Move to display up"
bind=SUPER+CTRL+SHIFT,Down,tagmon,down #"移动窗口到下侧显示器 / Move to display down"

# 应用与快捷键帮助 / Applications and help
bind=SUPER,t,spawn,kitty #"打开终端 Kitty / Open terminal Kitty"
bind=SUPER,e,spawn,dolphin #"打开文件管理器 Dolphin / Open file manager Dolphin"
bind=SUPER,c,spawn,code #"打开编辑器 VS Code / Open editor VS Code"
bind=SUPER,b,spawn,firefox #"打开浏览器 Firefox / Open browser Firefox"
bind=CTRL+SHIFT,Escape,spawn,missioncenter #"打开系统监视器 / System monitor"
bind=SUPER,a,spawn,noctalia msg panel-toggle launcher #"打开应用启动器 / Application launcher"
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard #"打开剪贴板历史 / Clipboard history"
bind=SUPER,slash,spawn,noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet #"打开快捷键速查表 / Keybind cheatsheet"

# 标签 / Tags
bind=SUPER,1,view,1 #"切换到标签 1 / View tag 1"
bind=SUPER,2,view,2 #"切换到标签 2 / View tag 2"
bind=SUPER,3,view,3 #"切换到标签 3 / View tag 3"
bind=SUPER,4,view,4 #"切换到标签 4 / View tag 4"
bind=SUPER,5,view,5 #"切换到标签 5 / View tag 5"
bind=SUPER,6,view,6 #"切换到标签 6 / View tag 6"
bind=SUPER,7,view,7 #"切换到标签 7 / View tag 7"
bind=SUPER,8,view,8 #"切换到标签 8 / View tag 8"
bind=SUPER,9,view,9 #"切换到标签 9 / View tag 9"
bind=SUPER,0,view,10 #"切换到标签 10 / View tag 10"
bind=SUPER+SHIFT,1,tag,1 #"移动并跟随到标签 1 / Move and follow to tag 1"
bind=SUPER+SHIFT,2,tag,2 #"移动并跟随到标签 2 / Move and follow to tag 2"
bind=SUPER+SHIFT,3,tag,3 #"移动并跟随到标签 3 / Move and follow to tag 3"
bind=SUPER+SHIFT,4,tag,4 #"移动并跟随到标签 4 / Move and follow to tag 4"
bind=SUPER+SHIFT,5,tag,5 #"移动并跟随到标签 5 / Move and follow to tag 5"
bind=SUPER+SHIFT,6,tag,6 #"移动并跟随到标签 6 / Move and follow to tag 6"
bind=SUPER+SHIFT,7,tag,7 #"移动并跟随到标签 7 / Move and follow to tag 7"
bind=SUPER+SHIFT,8,tag,8 #"移动并跟随到标签 8 / Move and follow to tag 8"
bind=SUPER+SHIFT,9,tag,9 #"移动并跟随到标签 9 / Move and follow to tag 9"
bind=SUPER+SHIFT,0,tag,10 #"移动并跟随到标签 10 / Move and follow to tag 10"
bind=SUPER,Page_Up,viewtoleft #"切换到上一个标签 / Previous tag"
bind=SUPER,Page_Down,viewtoright #"切换到下一个标签 / Next tag"
bind=SUPER,i,viewtoleft #"切换到上一个标签 / Previous tag"
bind=SUPER,u,viewtoright #"切换到下一个标签 / Next tag"
bind=SUPER+CTRL,Page_Up,tagtoleft #"移动窗口到上一个标签 / Move to previous tag"
bind=SUPER+CTRL,Page_Down,tagtoright #"移动窗口到下一个标签 / Move to next tag"
bind=SUPER+CTRL,1,toggleview,1 #"叠加显示标签 1 / Toggle tag 1 in view"
bind=SUPER+CTRL,2,toggleview,2 #"叠加显示标签 2 / Toggle tag 2 in view"
bind=SUPER+CTRL,3,toggleview,3 #"叠加显示标签 3 / Toggle tag 3 in view"
bind=SUPER+CTRL,4,toggleview,4 #"叠加显示标签 4 / Toggle tag 4 in view"
bind=SUPER+CTRL,5,toggleview,5 #"叠加显示标签 5 / Toggle tag 5 in view"
bind=SUPER+CTRL,6,toggleview,6 #"叠加显示标签 6 / Toggle tag 6 in view"
bind=SUPER+CTRL,7,toggleview,7 #"叠加显示标签 7 / Toggle tag 7 in view"
bind=SUPER+CTRL,8,toggleview,8 #"叠加显示标签 8 / Toggle tag 8 in view"
bind=SUPER+CTRL,9,toggleview,9 #"叠加显示标签 9 / Toggle tag 9 in view"
bind=SUPER+CTRL,0,toggleview,10 #"叠加显示标签 10 / Toggle tag 10 in view"
bind=SUPER+CTRL+SHIFT,1,toggletag,1 #"切换窗口的标签 1 归属 / Toggle window membership in tag 1"
bind=SUPER+CTRL+SHIFT,2,toggletag,2 #"切换窗口的标签 2 归属 / Toggle window membership in tag 2"
bind=SUPER+CTRL+SHIFT,3,toggletag,3 #"切换窗口的标签 3 归属 / Toggle window membership in tag 3"
bind=SUPER+CTRL+SHIFT,4,toggletag,4 #"切换窗口的标签 4 归属 / Toggle window membership in tag 4"
bind=SUPER+CTRL+SHIFT,5,toggletag,5 #"切换窗口的标签 5 归属 / Toggle window membership in tag 5"
bind=SUPER+CTRL+SHIFT,6,toggletag,6 #"切换窗口的标签 6 归属 / Toggle window membership in tag 6"
bind=SUPER+CTRL+SHIFT,7,toggletag,7 #"切换窗口的标签 7 归属 / Toggle window membership in tag 7"
bind=SUPER+CTRL+SHIFT,8,toggletag,8 #"切换窗口的标签 8 归属 / Toggle window membership in tag 8"
bind=SUPER+CTRL+SHIFT,9,toggletag,9 #"切换窗口的标签 9 归属 / Toggle window membership in tag 9"
bind=SUPER+CTRL+SHIFT,0,toggletag,10 #"切换窗口的标签 10 归属 / Toggle window membership in tag 10"

# Mango 布局与暂存窗口 / Mango layouts and scratchpads
bind=SUPER,space,switch_layout #"轮换滚动、主从、居中主从、单窗、网格、螺旋布局 / Cycle layouts"
bind=SUPER+ALT,s,setlayout,scroller #"切换为滚动布局 / Scroller layout"
bind=SUPER+ALT,t,setlayout,tile #"切换为主从布局 / Master-stack layout"
bind=SUPER+ALT,c,setlayout,center_tile #"切换为居中主从布局 / Centered master layout"
bind=SUPER+ALT,m,setlayout,monocle #"切换为单窗标签页布局 / Monocle layout"
bind=SUPER+ALT,g,setlayout,grid #"切换为网格布局 / Grid layout"
bind=SUPER+ALT,d,setlayout,dwindle #"切换为螺旋布局 / Dwindle layout"
bind=SUPER,r,switch_proportion_preset,next #"切换到下一档预设列宽 / Next preset column width"
bind=SUPER+SHIFT,r,switch_proportion_preset,prev #"切换到上一档预设列宽 / Previous preset column width"
bind=SUPER,f,set_proportion,1.0 #"设置为整屏列宽 / Full-width column"
bind=SUPER,comma,scroller_stack,left #"向左堆叠滚动窗口 / Stack scroller window left"
bind=SUPER,period,scroller_stack,right #"向右堆叠滚动窗口 / Stack scroller window right"
bind=SUPER,Return,zoom #"将窗口提升为主窗口 / Promote window to master"
bind=SUPER,minus,setmfact,-0.05 #"缩小主区域 / Shrink master area"
bind=SUPER,equal,setmfact,+0.05 #"增大主区域 / Grow master area"
bind=SUPER+SHIFT,minus,incnmaster,-1 #"减少主窗口数量 / Fewer master windows"
bind=SUPER+SHIFT,equal,incnmaster,1 #"增加主窗口数量 / More master windows"
bind=SUPER,o,toggleoverview #"切换窗口总览 / Toggle overview"
bind=SUPER+SHIFT,o,togglejump #"通过字母跳转窗口 / Jump to window by label"
bind=SUPER,s,toggle_special_tag #"切换特殊工作区 / Toggle special workspace"
bind=SUPER+SHIFT,s,tag_special_tag #"移动窗口到特殊工作区并跟随 / Move to special workspace"
bind=SUPER+CTRL,s,tag_special_silent #"静默移入特殊工作区 / Send silently to special workspace"
bind=SUPER,grave,toggle_named_scratchpad,mango-scratch,none,kitty --class mango-scratch #"唤出或隐藏暂存终端 / Toggle scratch terminal"

# 截图与取色 / Screenshots and colors
bind=SUPER,p,spawn,screenshot area #"截图：选取区域或窗口 / Screenshot region or window"
bind=SUPER+CTRL,p,spawn,screenshot area true #"截图：冻结后选取区域或窗口 / Screenshot frozen region or window"
bind=SUPER+ALT,p,spawn,screenshot output #"截图：当前显示器 / Screenshot current display"
bind=NONE,Print,spawn,screenshot screen #"截图：所有显示器 / Screenshot all displays"
bind=SUPER+SHIFT,p,spawn,hyprpicker -a #"拾取屏幕颜色 / Color picker"

# 媒体与亮度 / Media and brightness
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0 #"音量增加 5%（最高 100%） / Volume up 5% (max 100%)"
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- #"音量降低 5% / Volume down 5%"
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle #"切换扬声器静音 / Toggle speaker mute"
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle #"切换麦克风静音 / Toggle microphone mute"
bindls=NONE,XF86AudioPlay,spawn,playerctl play-pause #"切换播放与暂停 / Play or pause"
bindls=NONE,XF86AudioPause,spawn,playerctl play-pause #"切换播放与暂停 / Play or pause"
bindl=NONE,XF86AudioStop,spawn,playerctl stop #"停止播放 / Stop playback"
bindl=NONE,XF86AudioPrev,spawn,playerctl previous #"播放上一首 / Previous track"
bindl=NONE,XF86AudioNext,spawn,playerctl next #"播放下一首 / Next track"
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set 5%+ #"亮度增加 5% / Brightness up 5%"
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 5%- #"亮度降低 5% / Brightness down 5%"

# 鼠标与手势 / Mouse and gestures
mousebind=SUPER,btn_left,moveresize,curmove #"拖动移动窗口 / Drag to move window"
mousebind=SUPER,btn_right,moveresize,curresize #"拖动调整窗口大小 / Drag to resize window"
axisbind=SUPER,UP,viewtoleft_have_client #"切换到上一个非空标签 / Previous occupied tag"
axisbind=SUPER,DOWN,viewtoright_have_client #"切换到下一个非空标签 / Next occupied tag"
gesturebind=NONE,right,3,viewprev_have_client #"三指右滑切换到上个标签 / Three-finger swipe to previous tag"
gesturebind=NONE,left,3,viewnext_have_client #"三指左滑切换到下个标签 / Three-finger swipe to next tag"
gesturebind=NONE,up,4,enteroverview #"四指上滑打开总览 / Four-finger swipe to open overview"
gesturebind=NONE,down,4,leaveoverview #"四指下滑关闭总览 / Four-finger swipe to close overview"
